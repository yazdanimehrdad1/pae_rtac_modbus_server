apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rtac-modbus-prod

resources:
- namespace.yaml
- ../../base

# CI pins the tag to the built git SHA via:
#   kustomize edit set image pae-rtac-server=<AR_HOST>/<PROJECT>/pae/pae-rtac-server:<sha>
images:
- name: pae-rtac-server
  newName: us-central1-docker.pkg.dev/prd-pae-rtac-server/pae/pae-rtac-server
  newTag: 85e9f7f73d29f8f8ee09a8e6e4690214484e0c8b

replicas:
- count: 2
  name: pae-rtac-server

# Override env-specific, non-secret config. Merged onto the base ConfigMap; the
# resulting content hash rolls the Deployment when any value changes.
configMapGenerator:
- behavior: merge
  literals:
  - LOG_LEVEL=INFO
  - REDIS_HOST=10.93.93.251
  - AGGREGATOR_MODBUS_HOST=REPLACE_AGGREGATOR_PROD_HOST
  name: pae-rtac-server-config

  # Cloud SQL instance + prod app resources.
  # Cloud SQL instance for the migration Job.
  # Workload Identity binding for prod.
  # Autoscaling range for prod.
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: pae-rtac-server
    spec:
      template:
        spec:
          initContainers:
            - name: cloud-sql-proxy
              env:
                - name: prd-pae-rtac-server:us-central1:rtac-pg-prod
                  value: prd-pae-rtac-server:us-central1:rtac-pg-prod
          containers:
            - name: app
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 1Gi
  target:
    kind: Deployment
    name: pae-rtac-server
- patch: |-
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: pae-rtac-server-migrate
    spec:
      template:
        spec:
          initContainers:
            - name: cloud-sql-proxy
              env:
                - name: prd-pae-rtac-server:us-central1:rtac-pg-prod
                  value: prd-pae-rtac-server:us-central1:rtac-pg-prod
  target:
    kind: Job
    name: pae-rtac-server-migrate
- patch: |-
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: pae-rtac-server
      annotations:
        iam.gke.io/gcp-service-account: rtac-modbus-prod@prd-pae-rtac-server.iam.gserviceaccount.com
  target:
    kind: ServiceAccount
    name: pae-rtac-server
- patch: |-
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: pae-rtac-server
    spec:
      minReplicas: 2
      maxReplicas: 6
  target:
    kind: HorizontalPodAutoscaler
    name: pae-rtac-server
