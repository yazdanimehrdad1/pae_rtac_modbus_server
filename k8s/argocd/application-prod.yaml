apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pae-rtac-server-prod
  namespace: argocd
  # Keep the app from being pruned if the Application manifest is removed by mistake.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: REPLACE_GIT_REPO_URL       # e.g. https://github.com/<org>/rtac_modbus_server.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: rtac-modbus-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
