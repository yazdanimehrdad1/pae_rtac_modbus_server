apiVersion: batch/v1
kind: Job
metadata:
  name: pae-rtac-server-migrate
  annotations:
    # Ordered by ArgoCD sync-wave within the normal sync (NOT a PreSync hook, which
    # would run before the ServiceAccount/ConfigMap this Job depends on exist):
    #   wave 0 = ServiceAccount/ConfigMap/Service, wave 1 = this Job, wave 2 = Deployment.
    # So schema is migrated once, after its deps exist and before the app rolls out.
    # Force+Replace delete+recreate the (immutable) Job when the image changes, so
    # new migrations run on each deploy — plain Replace fails on the immutable
    # auto-generated Job selector once a Job already exists.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pae-rtac-server
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: pae-rtac-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - "--structured-logs"
            - "--port=5432"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              value: REPLACE_PROJECT:REGION:INSTANCE
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: migrate
          image: pae-rtac-server
          # Bypass the image ENTRYPOINT (which starts uvicorn) and just migrate.
          command: ["python", "scripts/migrate_db.py"]
          envFrom:
            - configMapRef:
                name: pae-rtac-server-config
            - secretRef:
                name: pae-rtac-server-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
