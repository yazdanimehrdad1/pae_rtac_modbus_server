apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pae-rtac-server
  annotations:
    # Created after the Deployment (wave 2) — a PDB with no matching pods can report
    # Degraded, which would stall the sync if it ran in an earlier wave.
    argocd.argoproj.io/sync-wave: "3"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pae-rtac-server
